services:

    db:
        image: postgres:15-alpine
        secrets:
            - database_pwd
        environment:
            POSTGRES_PASSWORD_FILE: /run/secrets/database_pwd
            POSTGRES_DB: appdb
            POSTGRES_USER: etudiant
        volumes:
            - pg_data:/var/lib/postgresql/data
        networks:
            - reseau_interne
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U etudiant -d appdb"]

    api:
        build: ./api
        secrets:
            - database_pwd
        ports:
            - "5000:5000"
        environment:
            POSTGRES_PASSWORD_FILE: /run/secrets/database_pwd
            POSTGRES_DB: appdb
            POSTGRES_USER: etudiant
            POSTGRES_HOST: db
            POSTGRES_PORT: 5432
            WORKER_URL: http://worker:8000
        depends_on:
            db:
                condition: service_healthy
        networks:
            - reseau_interne
            - reseau_public

    frontend:
        build: ./frontend
        ports:
            - "3000:3000"
        depends_on:
            - api
        networks:
            - reseau_public

    worker:
        build: ./worker
        ports:
            - "8000:8000"
        depends_on:
            db:
                condition: service_healthy
        networks:
            - reseau_interne

# Déclaration des réseaux virtuels isolés
networks:
    reseau_interne:
    reseau_public:

# Déclaration des volumes persistants
volumes:
    pg_data:

# Déclaration des secrets
secrets:
    database_pwd:
        file: ./db_password.txt
